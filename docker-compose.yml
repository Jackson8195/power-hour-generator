services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/backend/media
      - ./backend/power_hour.db:/app/backend/power_hour.db
      - ./backend/.env:/app/backend/.env:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
